<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Lexical Editor CDN</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/lexical@0.16.1/lexical.js"></script>
  <script src="https://unpkg.com/@lexical/react@0.16.1/dist/LexicalReact.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="editor-container"></div>

  <script type="text/babel">
    const { createEditor } = Lexical;
    const { createEditor, FORMAT_TEXT_COMMAND, FORMAT_ELEMENT_COMMAND, $getSelection, $isRangeSelection, $createParagraphNode } = Lexical; 
    const { $getRoot } = Lexical;
    const { HeadingNode, QuoteNode } = Lexical; 
    const { CodeNode, CodeHighlightNode, $isCodeNode, $createCodeNode } = LexicalCode;
    const { ListNode, ListItemNode, INSERT_ORDERED_LIST_COMMAND, INSERT_UNORDERED_LIST_COMMAND, REMOVE_LIST_COMMAND } = LexicalList;
    const { LinkNode, TOGGLE_LINK_COMMAND } = LexicalLink; // From @lexical/link
    
    const { LexicalComposer } = LexicalReact;
    const { RichTextPlugin } = LexicalReact;
    const { ContentEditable } = LexicalReact;
    const { HistoryPlugin } = LexicalReact;
    const { OnErrorPlugin } = LexicalReact;
    const { ListPlugin } = LexicalList; 
    const { LinkPlugin } = LexicalLink; // From @lexical/link
    const { useLexicalComposerContext } = LexicalReact;

    const editorConfig = {
      namespace: 'MyEditor',
      theme: {
        ltr: 'ltr',
        placeholder: 'editor-placeholder',
        code: 'code-highlight', 
        link: 'editor-link', // Theme class for links
        heading: {
          h1: 'editor-heading-h1',
          h2: 'editor-heading-h2',
          h3: 'editor-heading-h3',
        },
        quote: 'editor-quote',
        list: {
          ul: 'editor-list-ul',
          ol: 'editor-list-ol',
          listitem: 'editor-listitem',
        },
      },
      onError(error) {
        console.error(error); 
      },
    };
    
    function Toolbar() {
      const [editor] = useLexicalComposerContext();

      const formatText = (format) => {
        editor.dispatchCommand(FORMAT_TEXT_COMMAND, format);
      };

      const formatHeading = (level) => {
        editor.update(() => {
          const selection = $getSelection();
          if ($isRangeSelection(selection)) {
            Lexical.$setBlocksType(selection, () => Lexical.$createHeadingNode(level));
          }
        });
      };
      
      const formatBlockquote = () => {
        editor.update(() => {
          const selection = $getSelection();
          if ($isRangeSelection(selection)) {
            Lexical.$setBlocksType(selection, () => Lexical.$createQuoteNode());
          }
        });
      };

      const formatList = (type) => {
        if (type === 'ul') editor.dispatchCommand(INSERT_UNORDERED_LIST_COMMAND, undefined);
        else editor.dispatchCommand(INSERT_ORDERED_LIST_COMMAND, undefined);
      };
      
      const formatCodeBlock = () => {
        editor.update(() => {
            const selection = $getSelection();
            if ($isRangeSelection(selection)) {
                const nodes = selection.getNodes();
                if (nodes.length > 0 && nodes.every(node => $isCodeNode(node.getParent()))) {
                     Lexical.$setBlocksType(selection, () => $createParagraphNode());
                } else {
                     Lexical.$setBlocksType(selection, () => $createCodeNode());
                }
            }
        });
      };

      const insertLink = () => {
        const url = window.prompt("Enter URL:");
        if (url) {
          editor.dispatchCommand(TOGGLE_LINK_COMMAND, url);
        }
      };

      return (
        <div className="toolbar">
          <button onClick={() => formatText('bold')}>Bold</button>
          <button onClick={() => formatText('italic')}>Italic</button>
          <button onClick={() => formatText('underline')}>Underline</button>
          <button onClick={() => formatText('strikethrough')}>Strikethrough</button>
          <button onClick={() => formatText('code')}>Inline Code</button>
          <button onClick={() => formatHeading('h1')}>H1</button>
          <button onClick={() => formatHeading('h2')}>H2</button>
          <button onClick={() => formatHeading('h3')}>H3</button>
          <button onClick={() => formatBlockquote()}>Quote</button>
          <button onClick={() => formatList('ul')}>UL</button>
          <button onClick={() => formatList('ol')}>OL</button>
          <button onClick={() => formatCodeBlock()}>Code Block</button>
          <button onClick={insertLink}>Add/Edit Link</button>
        </div>
      );
    }

    function App() {
      const initialConfig = {
        ...editorConfig,
        editorState: null, // Can be pre-populated for testing specific states
        nodes: [
          HeadingNode, QuoteNode, 
          ListNode, ListItemNode,
          CodeNode, CodeHighlightNode,
          LinkNode 
        ]
      };
      
      // Expose editor instance for testing
      const onEditorInit = (editor) => {
        window.lexicalEditorInstance = editor;
        console.log("Lexical editor instance exposed on window.lexicalEditorInstance");
        // You can also call runAllTests() here automatically if desired,
        // but manual call from console is usually better for development.
        // runAllTests(); 
        return null; // onEditorInit doesn't need to render anything
      };

      return (
        <LexicalComposer initialConfig={initialConfig}>
          <Toolbar />
          <div className="editor-shell" style={{position: 'relative'}}> 
            {/* A bit of a hack to get editor instance once available */}
            <LexicalReact.LexicalEffect onInit={onEditorInit} />
            <RichTextPlugin
              contentEditable={<ContentEditable className="editor-input" />}
              placeholder={<div className="editor-placeholder">Enter some rich text...</div>}
              ErrorBoundary={LexicalReact.LexicalErrorBoundary}
            />
            <HistoryPlugin />
            <OnErrorPlugin onError={editorConfig.onError} />
            <ListPlugin />
            <LinkPlugin /> {/* Add LinkPlugin */}
          </div>
        </LexicalComposer>
      );
    }

    ReactDOM.render(<App />, document.getElementById('editor-container'));
  </script>

  <script type="text/babel">
    // --- Test Utilities & Test Functions ---
    // Instructions:
    // 1. Open your browser's developer console.
    // 2. Ensure `window.lexicalEditorInstance` is available (should log message above).
    // 3. Call `runAllTests()` to execute all tests.
    // 4. Check the console for PASS/FAIL messages.

    const editor = () => window.lexicalEditorInstance; // Convenience accessor

    function resetEditorContent(initialText = "") {
      if (!editor()) {
        console.error("Editor instance not found for reset.");
        return;
      }
      editor().update(() => {
        const root = Lexical.$getRoot();
        root.clear();
        if (initialText) {
          const paragraph = Lexical.$createParagraphNode();
          const textNode = Lexical.$createTextNode(initialText);
          paragraph.append(textNode);
          root.append(paragraph);
          // Select the text for formatting tests
          const selection = Lexical.$createRangeSelection();
          selection.anchor.set(textNode.getKey(), 0, 'text');
          selection.focus.set(textNode.getKey(), initialText.length, 'text');
          Lexical.$setSelection(selection);
        }
      });
    }

    function logTestResult(testName, passed, message = "") {
      console.log(`[${passed ? 'PASS' : 'FAIL'}] ${testName}: ${message}`);
    }
    
    // --- Individual Test Functions ---

    function testBold() {
      const testName = "testBold";
      resetEditorContent("Test bold text");
      editor().dispatchCommand(Lexical.FORMAT_TEXT_COMMAND, "bold");
      let passed = false;
      editor().getEditorState().read(() => {
        const selection = Lexical.$getSelection();
        if (Lexical.$isRangeSelection(selection)) {
          const nodes = selection.getNodes();
          if (nodes.length > 0 && nodes[0].hasFormat("bold")) {
            passed = true;
          }
        }
      });
      logTestResult(testName + " (Apply)", passed, "Text should be bold");

      // Test remove bold
      editor().dispatchCommand(Lexical.FORMAT_TEXT_COMMAND, "bold");
      passed = false;
      editor().getEditorState().read(() => {
        const selection = Lexical.$getSelection();
        if (Lexical.$isRangeSelection(selection)) {
          const nodes = selection.getNodes();
           if (nodes.length > 0 && !nodes[0].hasFormat("bold")) {
            passed = true;
          }
        }
      });
      logTestResult(testName + " (Remove)", passed, "Text should not be bold");
    }

    function testItalic() {
      const testName = "testItalic";
      resetEditorContent("Test italic text");
      editor().dispatchCommand(Lexical.FORMAT_TEXT_COMMAND, "italic");
      let passed = false;
      editor().getEditorState().read(() => {
        const selection = Lexical.$getSelection();
        if (Lexical.$isRangeSelection(selection)) {
          const nodes = selection.getNodes();
          if (nodes.length > 0 && nodes[0].hasFormat("italic")) {
            passed = true;
          }
        }
      });
      logTestResult(testName + " (Apply)", passed, "Text should be italic");

      editor().dispatchCommand(Lexical.FORMAT_TEXT_COMMAND, "italic");
      passed = false;
      editor().getEditorState().read(() => {
        const selection = Lexical.$getSelection();
        if (Lexical.$isRangeSelection(selection)) {
           const nodes = selection.getNodes();
           if (nodes.length > 0 && !nodes[0].hasFormat("italic")) {
            passed = true;
          }
        }
      });
      logTestResult(testName + " (Remove)", passed, "Text should not be italic");
    }
    
    function testUnderline() {
      const testName = "testUnderline";
      resetEditorContent("Test underline text");
      editor().dispatchCommand(Lexical.FORMAT_TEXT_COMMAND, "underline");
      let passed = false;
      editor().getEditorState().read(() => {
        const selection = Lexical.$getSelection();
        if (Lexical.$isRangeSelection(selection)) {
          const nodes = selection.getNodes();
          if (nodes.length > 0 && nodes[0].hasFormat("underline")) {
            passed = true;
          }
        }
      });
      logTestResult(testName + " (Apply)", passed, "Text should be underlined");

      editor().dispatchCommand(Lexical.FORMAT_TEXT_COMMAND, "underline");
      passed = false;
      editor().getEditorState().read(() => {
        const selection = Lexical.$getSelection();
        if (Lexical.$isRangeSelection(selection)) {
           const nodes = selection.getNodes();
           if (nodes.length > 0 && !nodes[0].hasFormat("underline")) {
            passed = true;
          }
        }
      });
      logTestResult(testName + " (Remove)", passed, "Text should not be underlined");
    }

    function testHeading1() {
      const testName = "testHeading1";
      resetEditorContent("Test H1"); // Content doesn't matter as much as block type
      editor().update(() => {
        const selection = Lexical.$getSelection();
        if (Lexical.$isRangeSelection(selection)) {
            Lexical.$setBlocksType(selection, () => Lexical.$createHeadingNode('h1'));
        }
      });
      let passed = false;
      editor().getEditorState().read(() => {
        const root = Lexical.$getRoot();
        const firstChild = root.getFirstChild();
        if (firstChild && firstChild.getType() === 'heading' && firstChild.getTag() === 'h1') {
          passed = true;
        }
      });
      logTestResult(testName, passed, "Block should be HeadingNode H1");
    }
    
    function testBlockquote() {
      const testName = "testBlockquote";
      resetEditorContent("Test Blockquote");
      editor().update(() => {
        const selection = Lexical.$getSelection();
        if (Lexical.$isRangeSelection(selection)) {
            Lexical.$setBlocksType(selection, () => Lexical.$createQuoteNode());
        }
      });
      let passed = false;
      editor().getEditorState().read(() => {
        const root = Lexical.$getRoot();
        const firstChild = root.getFirstChild();
        if (firstChild && firstChild.getType() === 'quote') {
          passed = true;
        }
      });
      logTestResult(testName, passed, "Block should be QuoteNode");
    }

    function testOrderedList() {
      const testName = "testOrderedList";
      resetEditorContent("Item 1"); // Will become first list item
      editor().dispatchCommand(LexicalList.INSERT_ORDERED_LIST_COMMAND, undefined);
      let passed = false;
      editor().getEditorState().read(() => {
        const root = Lexical.$getRoot();
        const firstChild = root.getFirstChild(); // Should be ListNode
        if (firstChild && firstChild.getType() === 'list' && firstChild.getListType() === 'number') {
          const listItem = firstChild.getFirstChild();
          if (listItem && listItem.getType() === 'listitem') {
            passed = true;
          }
        }
      });
      logTestResult(testName, passed, "Should create an ordered list with a list item");
    }
    
    function testLink() {
      const testName = "testLink";
      const testUrl = "https://example.com";
      resetEditorContent("Test link text");
      editor().dispatchCommand(LexicalLink.TOGGLE_LINK_COMMAND, testUrl);
      let passed = false;
      editor().getEditorState().read(() => {
        const selection = Lexical.$getSelection();
        if (Lexical.$isRangeSelection(selection)) {
          const nodes = selection.getNodes();
          // For links, the LinkNode is often the parent of the TextNode
          if (nodes.length > 0 && nodes[0].getParent() && nodes[0].getParent().getType() === 'link' && nodes[0].getParent().getURL() === testUrl) {
            passed = true;
          }
        }
      });
      logTestResult(testName, passed, `LinkNode should exist with URL ${testUrl}`);
    }


    // --- Run All Tests ---
    function runAllTests() {
      if (!editor()) {
        console.error("Lexical editor instance not found. Cannot run tests.");
        return;
      }
      console.log("--- Starting All Tests ---");
      testBold();
      testItalic();
      testUnderline();
      testHeading1();
      testBlockquote();
      testOrderedList();
      testLink();
      console.log("--- All Tests Finished ---");
    }

  </script>

  <script src="https://unpkg.com/@lexical/list@0.16.1/dist/LexicalList.js"></script>
  <script src="https://unpkg.com/@lexical/code@0.16.1/dist/LexicalCode.js"></script>
  <script src="https://unpkg.com/@lexical/link@0.16.1/dist/LexicalLink.js"></script>
</body>
</html>
